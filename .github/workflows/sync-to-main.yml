name: Sync Inprogress to Main

on:
  push:
    branches:
      - inprogress

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pobieramy pełną historię i wszystkie gałęzie

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync selected files to main
        run: |
          # Przełączenie na gałąź main i dopasowanie do stanu zdalnego
          git checkout main
          git reset --hard origin/main

          # Usunięcie starych plików, aby pliki usunięte na inprogress zniknęły też z main
          rm -rf src/ .github/ .idea/ 2>/dev/null || true
          rm -f pom.xml .gitignore LICENSE README.md changelog*.md update*.md 2>/dev/null || true

          # Pobranie z inprogress wyłącznie niezbędnych plików produkcyjnych i dokumentacji
          git checkout inprogress -- src/
          git checkout inprogress -- pom.xml
          git checkout inprogress -- .gitignore
          git checkout inprogress -- LICENSE
          git checkout inprogress -- README.md

          # Dodanie opcjonalnych plików changelog / update jeśli pojawią się w przyszłości
          for f in $(git ls-tree -r --name-only inprogress | grep -E '^(changelog.*|update.*)\.md$' || true); do
            git checkout inprogress -- "$f"
          done

          # Zatwierdzenie i wypchnięcie zmian na main
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "chore: sync clean code and docs from inprogress [skip ci]"
            git push origin main
          else
            echo "No changes to sync."
          fi
